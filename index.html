<html lang="pt-BR">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Grade - Farmácia</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#10b981">
    <!-- Tailwind CSS para um design moderno e responsivo -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilos personalizados para as transições das sanfonas e cores das matérias */
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
        .subject-card { transition: all 0.3s ease; }
        
        /* Cores de status após o cálculo */
        .status-passed { border-left: 4px solid #3b82f6; background-color: #eff6ff; } /* Azul: Já feita */
        .status-eligible { border-left: 4px solid #10b981; background-color: #ecfdf5; } /* Verde: Pode fazer */
        .status-blocked { border-left: 4px solid #ef4444; background-color: #fef2f2; } /* Vermelho: Bloqueada */
        .status-default { border-left: 4px solid #d1d5db; background-color: #f9fafb; } /* Cinza: Padrão */
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased pb-24">

    </header>

F310", "co": ""}, {"periodo": "Escolhas Condicionadas", "codigo": "FFI019", "nome": "Metabol Lipídeos e Obesidade", "pre": "BQM103", "co": ""}, {"periodo": "Escolhas Condicionadas", "codigo": "FFP002", "nome": "Téc Aplicações de Injetáveis", "pre": "", "co": ""}, {"periodo": "Escolhas Condicionadas", "codigo": "FFP001", "nome": "Técnicas de Socorrismo", "pre": "", "co": ""}, {"periodo": "Escolhas Condicionadas", "codigo": "FFP015", "nome": "Bases da Fitoterapia", "pre": "FFW473", "co": ""}, {"periodo": "Escolhas Condicionadas", "codigo": "FFP007", "nome": "Botânica Aplicada", "pre": "FFW363", "co": ""}, {"periodo": "Escolhas Condicionadas", "codigo": "FFM413", "nome": "Farmacotécnica Homeopática", "pre": "FFW354", "co": ""}, {"periodo": "Escolhas Condicionadas", "codigo": "FFP304", "nome": "Introd à Quím de Prod Naturais", "pre": "IQO230", "co": ""}, {"periodo": "Escolhas Condicionadas", "codigo": "FFP004", "nome": "Ctrl Micr. Drogas e Alim Orig Veg", "pre": "FFW363", "co": ""}, {"periodo": "Escolhas Condicionadas", "codigo": "FFP016", "nome": "Tópicos Especiais em Produtos Naturais", "pre": "FFW473", "co": ""}, {"periodo": "Escolhas Condicionadas", "codigo": "FFI013", "nome": "Biocatal Processos Industriais", "pre": "BQM103; IQO230", "co": "FFI013"}, {"periodo": "Escolhas Condicionadas", "codigo": "FFM027", "nome": "Cosmetologia", "pre": "FFW483", "co": ""}, {"periodo": "Escolhas Condicionadas", "codigo": "FFM022", "nome": "Química Industr Farmacêutica", "pre": "IQO230", "co": ""}, {"periodo": "Escolhas Condicionadas", "codigo": "FFM018", "nome": "Téc de Purificação na Ind Farm", "pre": "BQM103", "co": "FFM018"}, {"periodo": "Escolhas Condicionadas", "codigo": "FFM415", "nome": "Tecnologia Farmacêutica", "pre": "FFW354", "co": ""}, {"periodo": "Escolhas Condicionadas", "codigo": "FFM026", "nome": "Tópicos Especiais em Cromatografia na Indústria Farmacêutica", "pre": "FFW241", "co": ""}, {"periodo": "Escolhas Condicionadas", "codigo": "FFW006", "nome": "Tec Prod Hemocomp Hemoderiv", "pre": "FFW355", "co": ""}, {"periodo": "Escolhas Condicionadas", "codigo": "PNN015", "nome": "Cromatografia", "pre": "IQO230", "co": ""}, {"periodo": "Escolhas Condicionadas", "codigo": "FFC015", "nome": "Análises Forenses", "pre": "", "co": ""}, {"periodo": "Escolhas Condicionadas", "codigo": "FFP008", "nome": "Botânica Forense", "pre": "FFW353", "co": ""}, {"periodo": "Escolhas Condicionadas", "codigo": "FFM006", "nome": "Téc Mod de Proteína Ap C Farmacêuticas", "pre": "IQG114", "co": ""}, {"periodo": "Escolhas Condicionadas", "codigo": "FFI021", "nome": "Empreendedorismo Ciênc Farmac", "pre": "", "co": ""}, {"periodo": "Escolhas Condicionadas", "codigo": "FFW007", "nome": "Gestão de Proj e Comport Organiz", "pre": "", "co": ""}, {"periodo": "Escolhas Condicionadas", "codigo": "FFW008", "nome": "Gestão Farmacêutica Aplicada", "pre": "", "co": ""}, {"periodo": "Escolhas Condicionadas", "codigo": "FFI010", "nome": "Inovação Ciênc Farmacêuticas", "pre": "", "co": ""}, {"periodo": "Escolhas Condicionadas", "codigo": "FFM025", "nome": "Patentes Farmacêuticas e Farmoquímicas", "pre": "", "co": ""}, {"periodo": "Escolhas Condicionadas", "codigo": "FFW005", "nome": "História Descoberta Fármacos", "pre": "", "co": ""}, {"periodo": "Escolhas Condicionadas", "codigo": "LEB599", "nome": "Líng Bras de Sinais", "pre": "", "co": ""}, {"periodo": "Escolhas Condicionadas", "codigo": "NEP148", "nome": "Direitos Humanos e Racismo", "pre": "", "co": ""}, {"periodo": "Escolhas Condicionadas", "codigo": "NEP149", "nome": "Direitos Humanos e Meio Ambiente", "pre": "", "co": ""}];

        // Agrupar disciplinas por período
        const periodosMap = {};
        disciplinas.forEach(d => {
            const p = d.periodo;
            if (!periodosMap[p]) periodosMap[p] = [];
            periodosMap[p].push(d);
        });

        const container = document.getElementById('accordions-container');

        // Ordenar as chaves (1 a 10, depois Escolhas Condicionadas)
        const periodosKeys = Object.keys(periodosMap).sort((a, b) => {
            if (a === 'Escolhas Condicionadas') return 1;
            if (b === 'Escolhas Condicionadas') return -1;
            return parseInt(a) - parseInt(b);
        });

        // Gerar o HTML das Sanfonas
        periodosKeys.forEach((periodo, index) => {
            const titulo = periodo === 'Escolhas Condicionadas' ? periodo : `${periodo}º Período`;
            const div = document.createElement('div');
            div.className = 'mb-4 bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden';
            
            let materiasHtml = periodosMap[periodo].map(m => `
                <label id="card-${m.codigo}" class="subject-card status-default flex items-center p-4 mb-2 rounded-lg cursor-pointer hover:bg-gray-100">
                    <input type="checkbox" class="form-checkbox h-5 w-5 text-emerald-600 rounded mr-4" value="${m.codigo}" data-periodo="${periodo}">
                    <div class="flex-1">
                        <div class="font-bold text-gray-800">${m.codigo}</div>
                        <div class="text-sm text-gray-600">${m.nome}</div>
                        ${m.pre ? `<div class="text-xs text-red-500 mt-1">Pré: ${m.pre}</div>` : ''}
                        ${m.co ? `<div class="text-xs text-orange-500 mt-1">Co: ${m.co}</div>` : ''}
                    </div>
                </label>
            `).join('');

            div.innerHTML = `
                <details class="group" ${index === 0 ? 'open' : ''}>
                    <summary class="flex justify-between items-center font-medium cursor-pointer list-none p-5 text-lg bg-gray-50 hover:bg-gray-100 transition-colors">
                        <span>${titulo}</span>
                        <span class="transition group-open:rotate-180">
                            <svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="24"><polyline points="6 9 12 15 18 9"/></svg>
                        </span>
                    </summary>
                    <div class="p-5 border-t border-gray-100">
                        <div class="flex gap-2 mb-4">
                            <button onclick="marcarTudo('${periodo}')" class="flex-1 bg-emerald-100 text-emerald-700 py-2 rounded-lg text-sm font-semibold hover:bg-emerald-200 transition">Marcar Tudo</button>
                            <button onclick="limparTudo('${periodo}')" class="flex-1 bg-red-100 text-red-700 py-2 rounded-lg text-sm font-semibold hover:bg-red-200 transition">Limpar Tudo</button>
                        </div>
                        ${materiasHtml}
                    </div>
                </details>
            `;
            container.appendChild(div);
        });

        // Funções dos botões dentro das sanfonas (escopo isolado)
        function marcarTudo(periodo) {
            document.querySelectorAll(`input[data-periodo="${periodo}"]`).forEach(cb => cb.checked = true);
        }

        function limparTudo(periodo) {
            document.querySelectorAll(`input[data-periodo="${periodo}"]`).forEach(cb => cb.checked = false);
            resetColors();
        }

        function resetColors() {
            document.querySelectorAll('.subject-card').forEach(card => {
                card.className = "subject-card status-default flex items-center p-4 mb-2 rounded-lg cursor-pointer hover:bg-gray-100";
            });
        }

        // Função utilitária para extrair os códigos das strings de pré/correquisitos
        function extractCodes(str) {
            if (!str) return [];
            const regex = /[A-Z]{3}[A-Z0-9]{3}/g;
            const matches = str.match(regex);
            return matches ? matches : [];
        }

        // Lógica de Calcular a Grade
        document.getElementById('btn-calcular').addEventListener('click', () => {
            const concluidas = Array.from(document.querySelectorAll('input[type="checkbox"]:checked')).map(cb => cb.value);
            
            // Função para verificar se a matéria está apta a ser puxada
            const isApta = (mat) => {
                const preReqs = extractCodes(mat.pre);
                const coReqs = extractCodes(mat.co);

                // Verifica se TODOS os pré-requisitos foram concluídos
                const preOK = preReqs.every(req => concluidas.includes(req));
                if (!preOK) return false;

                // Verifica correquisitos: Para fazer a matéria, o correquisito precisa estar concluído 
                // OU você precisa estar apto a fazê-lo agora (ou seja, os pré-reqs dele estão OK).
                const coOK = coReqs.every(req => {
                    if (concluidas.includes(req)) return true; // Já fez o correq
                    const coMat = disciplinas.find(d => d.codigo === req);
                    if (!coMat) return true; // Se por acaso não achar, ignora
                    const preReqsDoCoReq = extractCodes(coMat.pre);
                    return preReqsDoCoReq.every(pr => concluidas.includes(pr));
                });

                return coOK;
            };

            disciplinas.forEach(mat => {
                const card = document.getElementById(`card-${mat.codigo}`);
                if (!card) return;

                // Resetar classes
                card.className = "subject-card flex items-center p-4 mb-2 rounded-lg cursor-pointer hover:bg-gray-100";

                if (concluidas.includes(mat.codigo)) {
                    card.classList.add('status-passed'); // Já fez (Azul)
                } else {
                    if (isApta(mat)) {
                        card.classList.add('status-eligible'); // Pode puxar (Verde)
                    } else {
                        card.classList.add('status-blocked'); // Bloqueada (Vermelho)
                    }
                }
            });
            
            // Scroll suave pro topo pra visualizar os resultados
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // Registrar o Service Worker (necessário para PWA)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
            .then(() => console.log("Service Worker Registrado com Sucesso!"))
            .catch(err => console.log("Erro no Service Worker: ", err));
        }
    </script>
</body>
